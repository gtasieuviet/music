name: Auto Update Music Config

on:
  push:
    paths:
      - '**.mp3'

jobs:
  update-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate music.cfg
        run: |
          echo "Đang quét các file MP3..."
          REPO_NAME="${{ github.repository }}"
          OWNER="${{ github.actor }}"
          
          # Tự động tìm tất cả file .mp3 và sinh đường dẫn link raw/pages vào file music.cfg
          find . -name "*.mp3" | sed 's|^\./||' | while read filename; do
            echo "https://$OWNER.github.io/$REPO_NAME/$filename"
          end > music.cfg
          
          echo "Đã tạo xong file music.cfg tự động!"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add music.cfg
          git commit -m "Auto-update music.cfg via GitHub Actions" || exit 0
          git push
